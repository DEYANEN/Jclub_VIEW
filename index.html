 const settings=appliedSearch||captureSearch();

  for(const id of multiIds){

function updateCompare(){const cc=comp.map(id=>cards.find(c=>c.id===id)).filter(Boolean),ss=cc.map(c=>{const p=getChoice('cmp-'+c.id);return boostedStats(c,getStats(c,p.level,p.boost,p.kira))});const rows=['合計',...keys];$('compareTable').innerHTML=`<table class="compare-data-table"><thead><tr><th>項目</th>${cc.map((c,i)=>`<th>${esc(c.name)}<div class="muted">${favoriteBoostLabel(c)}</div>${ss[i]?.estimated?'<div class="estimate-note">Lv70は推定値です</div>':''}</th>`).join('')}</tr></thead><tbody>${rows.map(k=>{const vals=ss.map(s=>s?(k==='合計'?sum(s):s[k]):null);const valid=vals.filter(v=>v!==null);const max=valid.length?Math.max(...valid):null;return `<tr><td>${k}</td>${vals.map(v=>`<td class="${v!==null&&v===max?'best':''}">${v===null?'未登録':num(v)}</td>`).join('')}</tr>`}).join('')}</tbody></table>`}
function closeCompare(){$('compareModal').classList.add('hidden');updateCompareButton();if($('detail').classList.contains('hidden'))document.body.classList.remove('detail-modal-open')}
function openCompareModal(){if(!comp.length)return;renderCompare();$('compareModal').classList.remove('hidden');updateCompareButton();document.body.classList.add('detail-modal-open');$('compareModal').querySelector('.detail-modal-content').scrollTop=0} $('openCompare').onclick=openCompareModal;$('floatingCompare').onclick=openCompareModal;
$('closeCompare').onclick=closeCompare;$('compareModal').addEventListener('click',e=>{if(e.target===$('compareModal'))closeCompare()});
$('customSense').addEventListener('click',e=>{const b=e.target.closest('[data-sense]');if(!b)return;customSenseFilter=customSenseFilter===b.dataset.sense?'':b.dataset.sense;document.querySelectorAll('#customSense button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.sense===customSenseFilter)));currentPage=1;markSearchPending()});$('selectSkillFilter').addEventListener('click',e=>{const b=e.target.closest('[data-select-skill]');if(!b)return;selectSkillFilter=selectSkillFilter===b.dataset.selectSkill?'':b.dataset.selectSkill;document.querySelectorAll('#selectSkillFilter button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.selectSkill===selectSkillFilter)));currentPage=1;markSearchPending()});$('pageSize').addEventListener('change',()=>{currentPage=1;filter()});$('pagination').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;currentPage+=b.dataset.page==='next'?1:-1;filter();document.querySelector('#results').scrollIntoView({block:'start',behavior:'smooth'})});$('results').addEventListener('click',e=>{const d=e.target.closest('[data-detail]'),c=e.target.closest('[data-compare]');if(d)showDetail(d.dataset.detail);if(c&&comp.length<5&&!comp.includes(c.dataset.compare)){comp.push(c.dataset.compare);renderCompare()}});$('compareBody').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){comp=comp.filter(id=>id!==b.dataset.remove);renderCompare()}});function closeDetail(){ $('detail').classList.add('hidden');document.body.classList.remove('detail-modal-open');} $('closeDetail').onclick=closeDetail;$('detail').addEventListener('click',e=>{if(e.target===$('detail'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('compareModal').classList.contains('hidden'))closeCompare();else if(!$('detail').classList.contains('hidden'))closeDetail()}});$('clearCompare').onclick=()=>{comp=[];renderCompare()};$('floatingCompareReset').onclick=()=>{comp=[];renderCompare()};$('q').addEventListener('input',()=>{exactName='';const q=$('q').value.trim().toLowerCase();const names=[...new Set(cards.map(c=>c.name).filter(Boolean))].filter(n=>q&&n.toLowerCase().includes(q)).sort(collator.compare).slice(0,40);$('nameSuggestions').innerHTML=names.map(n=>`<button type="button" data-name="${esc(n)}">${esc(n)}</button>`).join('');$('nameSuggestions').classList.toggle('hidden',!names.length);markSearchPending()});$('nameSuggestions').addEventListener('click',e=>{const b=e.target.closest('[data-name]');if(!b)return;exactName=b.dataset.name;$('q').value=exactName;$('nameSuggestions').classList.add('hidden');markSearchPending()});document.addEventListener('click',e=>{if(!e.target.closest('.name-field'))$('nameSuggestions').classList.add('hidden')});$('seriesQuery').addEventListener('input',showSeriesSuggestions);$('seriesQuery').addEventListener('focus',showSeriesSuggestions);$('seriesSuggestions').addEventListener('click',e=>{const all=e.target.closest('button[data-select-all]');if(all){const q=$('seriesQuery').value.trim().normalize('NFKC').toLowerCase();for(const v of availableSeries){if(v.normalize('NFKC').toLowerCase().includes(q))chosen.series.add(v)}$('seriesQuery').value='';renderSelectedSeries();showSeriesSuggestions();markSearchPending();return}const b=e.target.closest('button[data-value]');if(!b)return;chosen.series.add(b.dataset.value);$('seriesQuery').value='';renderSelectedSeries();showSeriesSuggestions();markSearchPending()});document.addEventListener('click',e=>{if(!e.target.closest('.series-field'))$('seriesSuggestions').classList.add('hidden')});$('includePastClub').addEventListener('change',()=>{updateClubs();currentPage=1;markSearchPending()});$('clubQuery').addEventListener('input',showClubSuggestions);$('clubQuery').addEventListener('focus',showClubSuggestions);$('clubSuggestions').addEventListener('click',e=>{const all=e.target.closest('button[data-select-all]');if(all){const q=normClub($('clubQuery').value).toLowerCase();for(const v of availableClubs){if(normClub(v).toLowerCase().includes(q))chosen.club.add(v)}$('clubQuery').value='';renderSelectedClubs();showClubSuggestions();markSearchPending();return}const b=e.target.closest('button[data-value]');if(!b)return;chosen.club.add(b.dataset.value);$('clubQuery').value='';renderSelectedClubs();showClubSuggestions();markSearchPending()});document.addEventListener('click',e=>{if(!e.target.closest('.club-field'))$('clubSuggestions').classList.add('hidden')});$('fitPitch').addEventListener('click',e=>{const b=e.target.closest('[data-fit-pos]');if(!b)return;const v=b.dataset.fitPos;if(chosen.fit.has(v))chosen.fit.delete(v);else chosen.fit.add(v);document.querySelectorAll('#fit [data-value]').forEach(x=>x.setAttribute('aria-pressed',String(chosen.fit.has(x.dataset.value))));renderFitPitch();currentPage=1;markSearchPending()});for(const id of multiIds){$(id).addEventListener('click',e=>{const b=e.target.closest('button[data-value]');if(!b)return;const v=b.dataset.value;if(chosen[id].has(v))chosen[id].delete(v);else chosen[id].add(v);b.setAttribute('aria-pressed',String(chosen[id].has(v)));if(id==='season')updateSeries();if(id==='club')renderSelectedClubs();if(id==='series')renderSelectedSeries();if(id==='fit')renderFitPitch();markSearchPending()})}for(const id of ['gradeMin','gradeMax','heightMin','heightMax','birthMin','birthMax'])$(id).addEventListener('input',()=>{currentPage=1;markSearchPending()});$('reset').onclick=()=>{for(const id of multiIds)chosen[id].clear();for(const id of ['q','seriesQuery','clubQuery','gradeMin','gradeMax','heightMin','heightMax','birthMin','birthMax'])$(id).value='';exactName='';customSenseFilter='';selectSkillFilter='';document.querySelectorAll('#selectSkillFilter button').forEach(x=>x.setAttribute('aria-pressed','false'));$('includePastClub').checked=false;currentPage=1;document.querySelectorAll('#customSense button').forEach(x=>x.setAttribute('aria-pressed','false'));$('nameSuggestions').classList.add('hidden');$('seriesSuggestions').classList.add('hidden');$('clubSuggestions').classList.add('hidden');initChoices();$('excludeRegular').checked=false;$('sortField').value='default';$('sortDirection').value='desc';applySearch()};function markSearchPending(){$('searchHint').textContent='条件が変更されています。「検索する」を押すと反映します。'}$('searchButton').addEventListener('click',applySearch);$('sortField').addEventListener('change',markSearchPending);$('sortDirection').addEventListener('change',markSearchPending);$('excludeRegular').addEventListener('change',markSearchPending);$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('nameSuggestions').classList.add('hidden');applySearch()}});const favoriteKey='jclub-portal-favorite-club';let favoriteClub='';try{favoriteClub=localStorage.getItem(favoriteKey)||''}catch(e){}function renderFavorite(){ $('favoriteName').textContent=favoriteClub||'未設定';$('favoriteSelect').value=favoriteClub;$('favoriteWidget').classList.remove('editing')}function initFavorite(){const vals=[...new Set(cards.flatMap(c=>[c.club,c.clubLink?.current,...(c.clubLink?.past||[])]).map(normClub).filter(Boolean))].sort(collator.compare);$('favoriteSelect').innerHTML='<option value="">未設定</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(favoriteClub&&!vals.includes(favoriteClub))$('favoriteSelect').insertAdjacentHTML('beforeend',`<option value="${esc(favoriteClub)}">${esc(favoriteClub)}</option>`);renderFavorite()}$('favoriteEdit').onclick=()=>{$('favoriteSelect').value=favoriteClub;$('favoriteWidget').classList.add('editing')};$('favoriteCancel').onclick=renderFavorite;$('favoriteSave').onclick=()=>{favoriteClub=$('favoriteSelect').value;try{if(favoriteClub)localStorage.setItem(favoriteKey,favoriteClub);else localStorage.removeItem(favoriteKey)}catch(e){}renderFavorite();if(selectedId&&!$('detail').classList.contains('hidden'))updateDetail();if(comp.length&&!$('compareModal').classList.contains('hidden'))updateCompare()};function initChoices(){buildChoices('season',cards.map(c=>c.season));updateSeries();buildChoices('position',cards.map(c=>c.position),orderPos);updateClubs();buildChoices('fit',cards.flatMap(c=>c.positions?.full||[]),orderFit);renderFitPitch();buildChoices('type',cards.map(c=>c.type),orderType)}fetch('./data/cards.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('データ形式が不正');cards=data;initChoices();initFavorite();applySearch()}).catch(e=>{$('count').textContent='データを読み込めませんでした';$('results').innerHTML=`<div class="notice">${esc(e.message)}。ローカルサーバーで開いてください。</div>`});
